# Dependabot for speedkey (Node client + Rust core only; no java/python/go trees).
# One weekly PR per ecosystem and directory: every update type is grouped, so a
# Monday brings at most one PR per entry below instead of one PR per dependency.
# Each PR still runs the Node matrix; npm-cd.yml skips dependabot PRs.
version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      groups:
          npm-root:
              patterns:
                  - "*"
      labels:
          - "dependencies"
          - "npm"
    - package-ecosystem: "npm"
      directory: "/node"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      groups:
          npm-node:
              patterns:
                  - "*"
      labels:
          - "dependencies"
          - "npm"
    - package-ecosystem: "cargo"
      directory: "/glide-core"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      groups:
          cargo-glide-core:
              patterns:
                  - "*"
      labels:
          - "dependencies"
          - "cargo"
    - package-ecosystem: "cargo"
      directory: "/glide-logger"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      groups:
          cargo-glide-logger:
              patterns:
                  - "*"
      labels:
          - "dependencies"
          - "cargo"
    - package-ecosystem: "cargo"
      directory: "/glide-telemetry"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      groups:
          cargo-glide-telemetry:
              patterns:
                  - "*"
      labels:
          - "dependencies"
          - "cargo"
    - package-ecosystem: "cargo"
      directory: "/node/rust-client"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      groups:
          cargo-node-rust-client:
              patterns:
                  - "*"
      labels:
          - "dependencies"
          - "cargo"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      groups:
          github-actions-root:
              patterns:
                  - "*"
      labels:
          - "dependencies"
          - "github-actions"
